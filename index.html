<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un regalo per te</title>
    <style>
        body {
            margin: 0;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #000;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 25px 50px;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            background: #0078d4;
            text-decoration: none;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #005ea6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>C'è un regalo per te Mattia B.</h1>
        <p>da parte di Giacomo C.</p>

        <a
            class="btn"
            href="https://www.youtube.com/watch?v=T1G4wNahcFA"
            target="_blank"
            rel="noopener noreferrer"
        >
            Clicca qui
        </a>
    </div>
</body>
</html>
