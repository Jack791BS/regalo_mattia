<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un regalo per Mattia</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    .container {
        padding-top: 80px;
    }

    h1 {
        font-size: 4rem;
        color: #000;
        margin-bottom: 10px;
    }

    .firma {
        font-size: 1.5rem;
        color: #666;
        margin-bottom: 30px;
    }

    #message {
        min-height: 40px;
        font-size: 1.8rem;
        font-weight: bold;
        color: #e63946;
        margin-bottom: 20px;
    }

    #giftBtn {
        position: absolute;
        left: 50%;
        top: 55%;
        transform: translate(-50%, -50%);
        padding: 20px 50px;
        font-size: 2rem;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background: #0078d4;
        color: white;
        cursor: pointer;
    }

    #giftBtn:hover {
        background: #005ea6;
    }

    #videoContainer {
        display: none;
        margin-top: 30px;
    }

    iframe {
        width: 900px;
        max-width: 90%;
        height: 500px;
        border: none;
        border-radius: 12px;
    }
</style>
</head>

<body>

<div class="container">
    <h1>C'è un regalo per te Mattia B.</h1>
    <div class="firma">da parte di Giacomo C.</div>

    <div id="message"></div>

    <div id="videoContainer">
        https://www.youtube.com/embed/T1G4wNahcFA?autoplay=1
        </iframe>
    </div>
</div>

<button id="giftBtn">CLICCA QUI</button>

<script>
let tentativi = 0;

const btn = document.getElementById("giftBtn");
const message = document.getElementById("message");
const videoContainer = document.getElementById("videoContainer");

btn.addEventListener("click", () => {
    tentativi++;

    if (tentativi < 3) {

        message.textContent = "😜 Prova ancora una volta!";

        const maxX = window.innerWidth - btn.offsetWidth;
        const maxY = window.innerHeight - btn.offsetHeight;

        btn.style.left = Math.random() * maxX + "px";
        btn.style.top = Math.random() * maxY + "px";
        btn.style.transform = "none";

    } else {

        btn.style.display = "none";
        message.textContent = "🎁 Ecco il tuo regalo!";
        videoContainer.style.display = "block";

    }
});
</script>

</body>
</html>
